<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>SakulPedo · Dokumentation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ---------- tokens ---------- */
  :root{
    --bg:#EDEAE2;--bg-2:#E3DFD5;--paper:#FDFCFA;--raise:#FFFFFF;
    --ink:#141210;--ink-soft:#3D3833;--muted:#7C746A;
    --accent:#1F3CC7;--accent-ink:#fff;--accent-soft:#E2E7FB;--accent-line:#C3CDF6;
    --flag:#B23A2E;
    --line:#D9D4C9;--line-soft:#E6E2D9;
    --shadow-s:0 1px 2px rgba(20,18,16,.05),0 2px 8px rgba(20,18,16,.04);
    --shadow-m:0 2px 4px rgba(20,18,16,.06),0 10px 28px rgba(20,18,16,.07);
    --shadow-l:0 12px 48px rgba(20,18,16,.14);
    --ava-bg:hsl(var(--h,230) 62% 92%);--ava-ink:hsl(var(--h,230) 58% 34%);
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
    --disp:"Bricolage Grotesque",system-ui,sans-serif;
    --body:"Inter",system-ui,sans-serif;
    --r-s:9px;--r-m:13px;--r-l:18px;
  }
  @media(prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#100F0D;--bg-2:#171613;--paper:#1A1916;--raise:#211F1B;
      --ink:#F3F0EA;--ink-soft:#D4CFC6;--muted:#948C82;
      --accent:#93A6FF;--accent-ink:#0F1020;--accent-soft:#22263F;--accent-line:#3A4270;
      --flag:#E4796B;
      --line:#2E2C27;--line-soft:#252420;
      --shadow-s:0 1px 2px rgba(0,0,0,.4);
      --shadow-m:0 2px 6px rgba(0,0,0,.4),0 14px 34px rgba(0,0,0,.34);
      --shadow-l:0 16px 54px rgba(0,0,0,.55);
      --ava-bg:hsl(var(--h,230) 32% 24%);--ava-ink:hsl(var(--h,230) 80% 80%);
    }
  }
  :root[data-theme="dark"]{
    --bg:#100F0D;--bg-2:#171613;--paper:#1A1916;--raise:#211F1B;
    --ink:#F3F0EA;--ink-soft:#D4CFC6;--muted:#948C82;
    --accent:#93A6FF;--accent-ink:#0F1020;--accent-soft:#22263F;--accent-line:#3A4270;
    --flag:#E4796B;
    --line:#2E2C27;--line-soft:#252420;
    --shadow-s:0 1px 2px rgba(0,0,0,.4);
    --shadow-m:0 2px 6px rgba(0,0,0,.4),0 14px 34px rgba(0,0,0,.34);
    --shadow-l:0 16px 54px rgba(0,0,0,.55);
    --ava-bg:hsl(var(--h,230) 32% 24%);--ava-ink:hsl(var(--h,230) 80% 80%);
  }

  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
  body{
    font-family:var(--body);color:var(--ink);line-height:1.65;
    background:
      radial-gradient(1100px 620px at 88% -8%,color-mix(in srgb,var(--accent) 11%,transparent),transparent 62%),
      radial-gradient(760px 460px at 4% 4%,color-mix(in srgb,var(--flag) 7%,transparent),transparent 60%),
      var(--bg);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  ::selection{background:var(--accent);color:var(--accent-ink)}
  .wrap{max-width:1320px;margin:0 auto;padding:0 26px}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:10px;margin-bottom:15px;font-weight:600}
  .eyebrow::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}

  .btn{font:600 14px var(--body);color:var(--accent-ink);background:var(--ink);border:none;border-radius:var(--r-s);padding:11px 18px;cursor:pointer;box-shadow:var(--shadow-s);transition:transform .12s cubic-bezier(.2,.8,.3,1),box-shadow .2s,filter .2s}
  .btn{color:#fff}
  .btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-m);filter:brightness(1.08)}
  .btn:active{transform:translateY(0);box-shadow:var(--shadow-s)}
  .btn.accent{background:var(--accent);color:var(--accent-ink)}

  /* ---------- reading progress ---------- */
  #progress{position:fixed;inset:0 auto auto 0;height:2px;width:0;z-index:120;background:linear-gradient(90deg,var(--accent),var(--flag));transition:width .1s linear}

  /* ---------- header ---------- */
  header{position:sticky;top:0;z-index:100;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px) saturate(1.5);-webkit-backdrop-filter:blur(14px) saturate(1.5)}
  .bar{display:flex;align-items:center;gap:13px;height:70px}
  .logo{width:15px;height:15px;flex:none;background:var(--accent);transform:rotate(45deg);border-radius:3px;box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 16%,transparent);transition:transform .5s cubic-bezier(.2,.8,.3,1)}
  header:hover .logo{transform:rotate(225deg)}
  .mark{font-family:var(--disp);font-weight:800;font-size:25px;letter-spacing:-.03em}
  .mark b{color:var(--accent);font-weight:800}
  .tag{margin-left:auto;font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  .icon-btn{flex:none;width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink-soft);cursor:pointer;transition:color .2s,border-color .2s,transform .12s,background .2s}
  .icon-btn:hover{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft);transform:translateY(-1px)}
  .icon-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .icon-btn .moon{display:none}
  :root[data-theme="dark"] .icon-btn .moon{display:block}
  :root[data-theme="dark"] .icon-btn .sun{display:none}
  @media(prefers-color-scheme:dark){
    :root:not([data-theme="light"]) .icon-btn .moon{display:block}
    :root:not([data-theme="light"]) .icon-btn .sun{display:none}
  }

  /* ---------- layout ---------- */
  main{padding:46px 0 40px}
  .grid{display:grid;grid-template-columns:250px minmax(0,1fr) 348px;gap:38px;align-items:start}
  .col{position:sticky;top:94px}
  nav.col{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-l);padding:20px 17px;box-shadow:var(--shadow-s)}

  /* ---------- toc ---------- */
  #toc{display:flex;flex-direction:column;gap:1px;max-height:calc(100vh - 190px);overflow:auto}
  #toc a{position:relative;display:block;font-size:13.5px;font-weight:500;color:var(--muted);text-decoration:none;padding:7px 10px 7px 15px;line-height:1.35;border-radius:0 8px 8px 0;transition:color .18s,background .18s}
  #toc a::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:2px;border-radius:2px;background:var(--line);transition:background .18s,top .18s,bottom .18s}
  #toc a:hover{color:var(--ink);background:var(--bg-2)}
  #toc a:hover::before{background:var(--muted)}
  #toc a.h3{padding-left:26px;font-size:12.5px;font-weight:400}
  #toc a.h3::before{left:13px}
  #toc a.on{color:var(--accent);font-weight:700;background:var(--accent-soft)}
  #toc a.on::before{background:var(--accent);top:2px;bottom:2px}
  #toc .empty{font-size:13px;color:var(--muted);padding:4px 0}

  /* ---------- doc ---------- */
  .doc{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-l);padding:40px 44px 44px;box-shadow:var(--shadow-m);animation:rise .55s cubic-bezier(.2,.8,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .doc h1{font-family:var(--disp);font-weight:800;font-size:clamp(38px,6vw,60px);line-height:.98;letter-spacing:-.035em;margin-bottom:12px;background:linear-gradient(165deg,var(--ink),color-mix(in srgb,var(--ink) 62%,var(--accent)));-webkit-background-clip:text;background-clip:text;color:transparent}
  .doc>.rule{height:4px;width:68px;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--flag));margin-bottom:30px}

  #content{font-size:15.5px;color:var(--ink-soft)}
  #content h2{font-family:var(--disp);font-weight:700;font-size:26px;letter-spacing:-.018em;color:var(--ink);margin:38px 0 10px;padding-top:14px;border-top:1px solid var(--line-soft);scroll-margin-top:100px}
  #content h3{font-family:var(--disp);font-weight:600;font-size:18.5px;letter-spacing:-.01em;color:var(--ink);margin:26px 0 6px;scroll-margin-top:100px}
  #content h2:first-child,#content h3:first-child{margin-top:0;padding-top:0;border-top:none}
  #content p{margin:0 0 13px}#content p:last-child{margin-bottom:0}
  #content ul{margin:0 0 14px;padding-left:2px;list-style:none}
  #content li{position:relative;margin-bottom:7px;padding-left:19px}
  #content li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:2px;background:var(--accent);opacity:.65;transform:rotate(45deg)}
  #content strong{font-weight:600;color:var(--ink)}
  #content em{color:var(--ink)}

  /* images */
  #content img{max-width:100%;height:auto;border:1px solid var(--line);border-radius:var(--r-m);background:var(--bg-2)}
  #content p img{vertical-align:middle;margin:0 2px}
  #content figure{margin:0 0 18px}
  #content figure img{display:block;width:100%;margin-bottom:7px;box-shadow:var(--shadow-s);transition:transform .35s cubic-bezier(.2,.8,.3,1),box-shadow .35s}
  #content figure:hover img{transform:translateY(-2px);box-shadow:var(--shadow-m)}
  #content figcaption{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--muted);text-align:center;text-transform:uppercase}
  #content figure.left,#content figure.right{width:38%;max-width:260px;margin-bottom:12px}
  #content figure.left{float:left;margin-right:24px;clear:left}
  #content figure.right{float:right;margin-left:24px;clear:right}
  #content h2{clear:both}
  #content::after{content:"";display:table;clear:both}

  /* ---------- comments ---------- */
  .panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-l);padding:22px;box-shadow:var(--shadow-s)}
  .ph{font-family:var(--disp);font-weight:700;font-size:21px;letter-spacing:-.015em;display:flex;align-items:baseline;gap:8px;margin-bottom:16px}
  .ph small{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:400}
  label{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;color:var(--muted)}
  input,textarea{width:100%;font:14px var(--body);color:var(--ink);background:var(--raise);border:1px solid var(--line);border-radius:var(--r-s);padding:10px 12px;transition:border-color .18s,box-shadow .18s,background .18s}
  input::placeholder,textarea::placeholder{color:color-mix(in srgb,var(--muted) 75%,transparent)}
  input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  textarea{resize:vertical;min-height:82px;line-height:1.55}
  .field{margin-bottom:12px}
  #cmtForm .btn{width:100%}

  .list{margin-top:20px;max-height:min(58vh,620px);overflow:auto;padding-right:6px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  .list::-webkit-scrollbar{width:7px}
  .list::-webkit-scrollbar-thumb{background:var(--line);border-radius:7px}
  .list::-webkit-scrollbar-track{background:transparent}
  .cmt{padding:16px 0;border-top:1px solid var(--line-soft);animation:rise .35s cubic-bezier(.2,.8,.3,1) both}
  .cmt:first-child{border-top:none;padding-top:4px}
  .top{display:flex;gap:11px;margin-bottom:8px;align-items:center}
  .ava{flex:none;width:35px;height:35px;border-radius:11px;background:var(--ava-bg);color:var(--ava-ink);font:700 14px var(--disp);display:grid;place-items:center;letter-spacing:-.02em}
  .who{font-weight:600;font-size:14px;line-height:1.25;color:var(--ink)}
  .when{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.04em}
  .text{font-size:14px;color:var(--ink-soft);margin:0 0 10px;white-space:pre-wrap;overflow-wrap:anywhere}
  .acts{display:flex;gap:8px}
  .act{display:inline-flex;align-items:center;gap:6px;font:500 12.5px var(--body);color:var(--muted);background:none;border:none;border-radius:7px;padding:4px 8px;cursor:pointer;transition:color .2s,background .2s}
  .act:hover{color:var(--accent);background:var(--accent-soft)}
  .act svg{width:14px;height:14px;transition:transform .2s}
  .act:active svg{transform:scale(.82)}
  .act.on{color:var(--accent);font-weight:600}
  .act.on svg{fill:color-mix(in srgb,var(--accent) 22%,transparent)}
  .rb{margin-top:12px;padding:14px;background:var(--bg-2);border:1px solid var(--line-soft);border-radius:var(--r-m);display:none}
  .rb.open{display:block;animation:rise .28s cubic-bezier(.2,.8,.3,1) both}
  .rb .btn{width:100%}
  .hint{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:7px}
  .replies:not(:empty){margin-top:4px}
  .reply{margin:11px 0 0 15px;padding:12px 14px;background:var(--bg-2);border-left:2px solid var(--accent);border-radius:0 var(--r-m) var(--r-m) 0;animation:rise .3s cubic-bezier(.2,.8,.3,1) both}
  .empty{color:var(--muted);font-size:14px;padding:14px 0}

  /* ---------- footer ---------- */
  footer{border-top:1px solid var(--line);margin-top:14px}
  .fbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:22px 0 34px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .fbar .dot{width:5px;height:5px;border-radius:50%;background:var(--accent)}
  .fbar .top-link{margin-left:auto;color:var(--muted);text-decoration:none;transition:color .2s}
  .fbar .top-link:hover{color:var(--accent)}

  /* ---------- toast ---------- */
  .toast{position:fixed;right:22px;bottom:22px;max-width:330px;padding:13px 17px;border-radius:var(--r-m);background:var(--ink);color:var(--bg);font:500 14px var(--body);box-shadow:var(--shadow-l);transform:translateY(150%);opacity:0;transition:transform .38s cubic-bezier(.2,.8,.3,1),opacity .3s;z-index:200}
  .toast.show{transform:translateY(0);opacity:1}
  .toast.err{background:var(--flag);color:#fff}

  /* ---------- responsive ---------- */
  @media(max-width:1180px){
    .grid{grid-template-columns:220px minmax(0,1fr)}
    aside.col{grid-column:1/-1;position:static}
    .list{max-height:none}
  }
  @media(max-width:900px){
    main{padding:30px 0 30px}
    .grid{grid-template-columns:1fr;gap:26px}
    .col{position:static}
    nav.col{padding:16px}
    #toc{flex-direction:row;flex-wrap:wrap;gap:5px;max-height:none;overflow:visible}
    #toc a{padding:5px 11px;border-radius:99px;border:1px solid var(--line);font-size:12.5px}
    #toc a::before{display:none}
    #toc a.h3{padding-left:11px}
    #toc a.on{border-color:var(--accent-line)}
    .doc{padding:26px 22px 30px;border-radius:var(--r-m)}
  }
  @media(max-width:640px){
    .wrap{padding:0 16px}
    .tag{display:none}
    #content figure.left,#content figure.right{float:none;max-width:100%;margin-left:0;margin-right:0}
    .toast{left:16px;right:16px;bottom:16px;max-width:none}
  }
  @media(prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important;scroll-behavior:auto}
  }
</style>
</head>
<body>
  <div id="progress"></div>

  <header><div class="wrap bar">
    <span class="logo"></span>
    <span class="mark">Sakul<b>Pedo</b></span>
    <span class="tag">Community-Doku</span>
    <button class="icon-btn" id="theme" type="button" aria-label="Farbschema wechseln" title="Farbschema wechseln">
      <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8L6 18M18 6l1.8-1.8"/></svg>
      <svg class="moon" viewBox="0 0 24 24"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>
    </button>
  </div></header>

  <main class="wrap">
    <div class="grid">
      <nav class="col" aria-label="Inhaltsverzeichnis"><div class="eyebrow">Inhalt</div><div id="toc"><div class="empty">…</div></div></nav>

      <article class="doc" id="about">
        <div class="eyebrow">Dokumentation</div>
        <h1>SakulTendo</h1>
        <div class="rule"></div>
        <div id="content"><p class="empty">Inhalt wird geladen …</p></div>
      </article>

      <aside class="col" id="comments"><div class="panel">
        <div class="ph">Kommentare <small id="count"></small></div>
        <form id="cmtForm">
          <div class="field"><label for="name">Name</label><input id="name" autocomplete="name" placeholder="Anonym"></div>
          <div class="field"><label for="comment">Kommentar</label><textarea id="comment" required placeholder="Was denkst du?"></textarea></div>
          <button class="btn accent" type="submit">Kommentar absenden</button>
        </form>
        <div class="list" id="list"></div>
      </div></aside>
    </div>
  </main>

  <footer><div class="wrap fbar">
    <span class="dot"></span><span>SakulPedo</span><span>·</span><span>Community-Doku</span>
    <a class="top-link" href="#about">↑ Nach oben</a>
  </div></footer>

  <div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const ini=n=>esc(n.trim().slice(0,2).toUpperCase()||'??');
const hue=n=>{let h=0;for(const ch of String(n))h=(h*31+ch.charCodeAt(0))%360;return h;};
const fmt=d=>{const s=Math.floor((Date.now()-new Date(d))/1000);if(s<60)return'gerade eben';if(s<3600){const m=Math.floor(s/60);return`vor ${m} Min.`;}if(s<86400){const h=Math.floor(s/3600);return`vor ${h} Std.`;}if(s<2592000){const dy=Math.floor(s/86400);return`vor ${dy} Tag${dy===1?'':'en'}`;}if(s<31536000){const mo=Math.floor(s/2592000);return`vor ${mo} Monat${mo===1?'':'en'}`;}const y=Math.floor(s/31536000);return`vor ${y} Jahr${y===1?'':'en'}`;};
const thumb='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 10v11M2 14v5a2 2 0 0 0 2 2h13.5a2 2 0 0 0 2-1.6l1.3-7A1.5 1.5 0 0 0 20.3 10H14V5a2 2 0 0 0-2-2l-3 7H2z"/></svg>';
const arrow='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 9V5l-7 7 7 7v-4c5 0 8 1.5 10 5 0-7-3-11-10-11z"/></svg>';

/* theme */
const savedTheme=localStorage.getItem('theme');
if(savedTheme)document.documentElement.dataset.theme=savedTheme;
$('#theme').addEventListener('click',()=>{
  const dark=matchMedia('(prefers-color-scheme:dark)').matches;
  const cur=document.documentElement.dataset.theme||(dark?'dark':'light');
  const next=cur==='dark'?'light':'dark';
  document.documentElement.dataset.theme=next;
  localStorage.setItem('theme',next);
});

let tt;
const toast=(m,e)=>{const t=$('#toast');t.textContent=m;t.className='toast show'+(e?' err':'');clearTimeout(tt);tt=setTimeout(()=>t.className='toast',3000);};

const liked=()=>JSON.parse(localStorage.getItem('likedComments')||'{}');
const isLiked=id=>liked()[id]===true;
const setLiked=(id,val)=>{const l=liked();if(val)l[id]=true;else delete l[id];localStorage.setItem('likedComments',JSON.stringify(l));};
const syncLikes=comments=>{const l={};comments.forEach(c=>{if(c.userLiked)l[c.id]=true;(c.replies||[]).forEach(r=>{if(r.userLiked)l[r.id]=true;});});localStorage.setItem('likedComments',JSON.stringify(l));};

/* markdown → html (line based, keine leeren Absätze) */
const img=/!\[([^\]]*)\]\((\S+?)\)/g;
const imgTag=(alt,src)=>`<img src="${esc(src)}" alt="${esc(alt)}" loading="lazy">`;
const inline=s=>esc(s).replace(img,'<img src="$2" alt="$1" loading="lazy">').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');
function md2html(md){
  let out='',list=false; const shut=()=>{if(list){out+='</ul>';list=false;}};
  for(const raw of md.split(/\r?\n/)){
    const l=raw.trim(); if(!l){shut();continue;} let m;
    if(m=l.match(/^!\[([^\]]*)\]\((\S+?)\)(?:\{(left|right|links|rechts)\})?$/)){
      shut();
      const side={links:'left',rechts:'right'}[m[3]]||m[3]||'';
      out+=`<figure${side?` class="${side}"`:''}>${imgTag(m[1],m[2])}${m[1]?`<figcaption>${inline(m[1])}</figcaption>`:''}</figure>`;
    }
    else if(m=l.match(/^### (.*)/)){shut();out+=`<h3>${inline(m[1])}</h3>`;}
    else if(m=l.match(/^## (.*)/)){shut();out+=`<h2>${inline(m[1])}</h2>`;}
    else if(m=l.match(/^# (.*)/)){shut();out+=`<h2>${inline(m[1])}</h2>`;}
    else if(m=l.match(/^[*-] (.*)/)){if(!list){out+='<ul>';list=true;}out+=`<li>${inline(m[1])}</li>`;}
    else{shut();out+=`<p>${inline(l)}</p>`;}
  } shut(); return out;
}

let tocHeads=[],tocLocked=false,tocTimer;
function updateToc(){
  if(!tocHeads.length||tocLocked)return;
  const atBottom=window.innerHeight+window.scrollY>=document.body.offsetHeight-20;
  let cur=tocHeads[0];
  if(atBottom){cur=tocHeads[tocHeads.length-1];}
  else{for(const h of tocHeads){if(h.getBoundingClientRect().top<=110)cur=h;else break;}}
  $$('#toc a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+cur.id));
}
function updateProgress(){
  const max=document.documentElement.scrollHeight-window.innerHeight;
  $('#progress').style.width=(max>0?Math.min(100,window.scrollY/max*100):0)+'%';
}
function buildToc(){
  const heads=[...$('#content').querySelectorAll('h2,h3')];
  if(!heads.length){$('#toc').innerHTML='<div class="empty">Keine Abschnitte</div>';return;}
  heads.forEach((h,i)=>h.id='s'+i);
  $('#toc').innerHTML=heads.map((h,i)=>`<a href="#s${i}" class="${h.tagName.toLowerCase()}">${esc(h.textContent)}</a>`).join('');
  tocHeads=heads;
  $$('#toc a').forEach(a=>a.addEventListener('click',()=>{
    tocLocked=true;clearTimeout(tocTimer);
    $$('#toc a').forEach(x=>x.classList.remove('on'));a.classList.add('on');
    tocTimer=setTimeout(()=>{tocLocked=false;updateToc();},700);
  }));
  updateToc();
}
window.addEventListener('scroll',()=>{updateToc();updateProgress();},{passive:true});
window.addEventListener('resize',updateProgress,{passive:true});

async function loadContent(){
  try{ $('#content').innerHTML=md2html(await(await fetch('content.md')).text()); }
  catch(e){ $('#content').innerHTML='<p class="empty">Fehler beim Laden des Inhalts.</p>'; }
  buildToc();updateProgress();
}

const replyHTML=(r,parentId)=>`<div class="reply" data-id="${r.id}"><div class="top" style="margin-bottom:3px"><div class="ava" style="--h:${hue(r.name)};width:27px;height:27px;font-size:11px;border-radius:9px">${ini(r.name)}</div><div><div class="who">${esc(r.name)}</div><div class="when">${fmt(r.date)}</div></div></div><div class="text">${esc(r.content)}</div><div class="acts"><button class="act like ${isLiked(r.id)?'on':''}" data-id="${r.id}">${thumb}<span class="n">${r.likes||0}</span></button><button class="act reply-btn" data-id="${r.id}">${arrow}Antworten</button></div><div class="rb" id="rb-${r.id}"><div class="field"><label>Name</label><input class="r-name" placeholder="Anonym"></div><div class="field"><label>Antwort</label><textarea class="r-text" placeholder="Deine Antwort …"></textarea></div><button class="btn send" data-id="${parentId}" data-rb="${r.id}">Antwort absenden</button></div></div>`;

const cmtHTML=c=>`<div class="cmt" data-id="${c.id}">
  <div class="top"><div class="ava" style="--h:${hue(c.name)}">${ini(c.name)}</div><div><div class="who">${esc(c.name)}</div><div class="when">${fmt(c.date)}</div></div></div>
  <div class="text">${esc(c.content)}</div>
  <div class="acts">
    <button class="act like ${isLiked(c.id)?'on':''}" data-id="${c.id}">${thumb}<span class="n">${c.likes||0}</span></button>
    <button class="act reply-btn" data-id="${c.id}">${arrow}Antworten</button>
  </div>
  <div class="rb" id="rb-${c.id}">
    <div class="field"><label>Name</label><input class="r-name" placeholder="Anonym"></div>
    <div class="field"><label>Antwort</label><textarea class="r-text" placeholder="Deine Antwort …"></textarea></div>
    <button class="btn send" data-id="${c.id}" data-rb="${c.id}">Antwort absenden</button>
  </div>
  <div class="replies">${(c.replies||[]).map(r=>replyHTML(r,c.id)).join('')}</div>
</div>`;

async function loadComments(){
  try{
    const c=await(await fetch('api/comments.php')).json();
    syncLikes(c);
    $('#count').textContent=c.length?`(${c.length})`:'';
    $('#list').innerHTML=c.length?c.map(cmtHTML).join(''):'<p class="empty">Noch keine Kommentare. Sei der Erste!</p>';
  }catch(e){ $('#list').innerHTML='<p class="empty">Fehler beim Laden der Kommentare.</p>'; }
}

$('#list').addEventListener('click',async e=>{
  const like=e.target.closest('.like'); if(like)return doLike(like);
  const rep=e.target.closest('.reply-btn');
  if(rep){const b=$('#rb-'+rep.dataset.id);$$('.rb.open').forEach(x=>x!==b&&x.classList.remove('open'));b.classList.toggle('open');return;}
  const send=e.target.closest('.send'); if(send)return doReply(send);
});

async function doLike(btn){
  const id=btn.dataset.id;
  try{const r=await(await fetch('api/like.php?id='+id,{method:'POST'})).json();
    if(r.success){btn.classList.toggle('on',r.liked);btn.querySelector('.n').textContent=r.likes;setLiked(id,r.liked);}
    else toast(r.message||'Fehler beim Liken',1);
  }catch(e){toast('Fehler beim Liken des Kommentars',1);}
}

async function doReply(btn){
  const id=btn.dataset.id, rbId=btn.dataset.rb, box=$('#rb-'+rbId);
  const name=box.querySelector('.r-name').value.trim(), content=box.querySelector('.r-text').value.trim();
  if(!content)return toast('Bitte fülle alle Felder aus',1);
  try{const r=await(await fetch('api/reply.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({commentId:id,name,content})})).json();
    if(r.success){$(`.cmt[data-id="${id}"] .replies`).insertAdjacentHTML('beforeend',replyHTML(r.reply,id));box.classList.remove('open');box.querySelector('.r-name').value='';box.querySelector('.r-text').value='';toast('Antwort erfolgreich hinzugefügt');}
    else toast(r.message||'Fehler beim Hinzufügen der Antwort',1);
  }catch(e){toast('Fehler beim Hinzufügen der Antwort',1);}
}

$('#cmtForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const name=$('#name').value.trim(), content=$('#comment').value.trim();
  if(!content)return toast('Bitte fülle alle Felder aus',1);
  try{const r=await(await fetch('api/comment.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,content})})).json();
    if(r.success){const em=$('#list .empty');em&&em.remove();$('#list').insertAdjacentHTML('afterbegin',cmtHTML(r.comment));$('#name').value='';$('#comment').value='';toast('Kommentar erfolgreich hinzugefügt');}
    else toast(r.message||'Fehler beim Hinzufügen des Kommentars',1);
  }catch(e){toast('Fehler beim Hinzufügen des Kommentars',1);}
});

loadContent(); loadComments();
</script>
